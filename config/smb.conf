# ==============================================================================
# Samba-Konfiguration: smb.conf
# Projektarbeit 3: Einrichtung eines zentralen Dateiservers (Gruppe 3)
# Unternehmen: Müller & Partner GmbH
# Subnetz: 172.16.30.0/24 | Server-IP: 172.16.30.10
# ==============================================================================

[global]
   workgroup = WORKGROUP
   server string = Dateiserver Mueller & Partner GmbH (Gruppe 3)
   netbios name = FILESERVER
   
   # Sicherheitskonfiguration
   security = user
   passdb backend = tdbsam
   map to guest = Bad User

   # Protokollierung & Logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   # Performance & Netzwerkeinstellungen
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes

# ==============================================================================
# FREIGABEN UND ZUGRIFFSRECHTE
# ==============================================================================

# 1. Public Freigabe: Alle authentifizierten Benutzer dürfen lesen und schreiben
[public]
   comment = Öffentliche Freigabe für alle Mitarbeiter und Leitung
   path = /srv/samba/public
   browseable = yes
   read only = no
   guest ok = no
   valid users = @mitarbeiter, @leitung
   create mask = 0777
   directory mask = 0777
   force group = mitarbeiter

# 2. Mitarbeiter Freigabe: Nur Mitglieder der Gruppe 'mitarbeiter' und Geschäftsleitung
[mitarbeiter]
   comment = Abteilungsfreigabe Mitarbeiter und Leitung
   path = /srv/samba/mitarbeiter
   browseable = yes
   read only = no
   guest ok = no
   valid users = @mitarbeiter, @leitung
   create mask = 0770
   directory mask = 0770
   force group = mitarbeiter

# 3. Leitung Freigabe: Exklusiv für Mitglieder der Gruppe 'leitung' (chef)
[leitung]
   comment = Vertrauliche Freigabe Geschäftsleitung
   path = /srv/samba/leitung
   browseable = yes
   read only = no
   guest ok = no
   valid users = @leitung
   create mask = 0770
   directory mask = 0770
   force group = leitung
